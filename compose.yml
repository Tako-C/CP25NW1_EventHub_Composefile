# version: '3.9'

services: 
  oracledb:
    image: container-registry.oracle.com/database/express
    container_name: Oracle_Event_hub
    environment:
      ORACLE_PWD: "system1234"
      ORACLE_CHARACTERSET: "AL32UTF8"
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - ./CP25NW1_EventHub_Backend/script_create_schema.sql:/tmp/script_create_schema.sql
    networks:
      - eventhub-net
    restart: unless-stopped

  eventhub-api:
      build: ./CP25NW1_EventHub_Backend
      container_name: eventhub_backend
      depends_on:
        - oracledb
      ports:
        - "8080:8080"
      environment:
        SPRING_DATASOURCE_URL: "jdbc:oracle:thin:@Oracle_Event_hub:1521/XEPDB1"
        SPRING_DATASOURCE_USERNAME: "C##ADMIN"
        SPRING_DATASOURCE_PASSWORD: "admin123"
        SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      volumes:
        - ./upload:/upload 
      networks:
        - eventhub-net
      restart: unless-stopped

  fastapi-app:
    build: .
    container_name:  eventhub-analysis-ai
    depends_on:
      - eventhub-api
    ports:
      - "8000:8000"
    env_file:
      - ./CP25NW1_EventHub_AI/.env
    volumes:
      - .:/app
    restart: always
    networks:
      - eventhub-net

  eventhub-frontend:
    build:
      context: ./CP25NW1_EventHub_Frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: eventhub_frontend
    depends_on:
      - eventhub-api
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL} #./
    networks:
      - eventhub-net

  proxy:
    container_name: eventhub_proxy
    image: nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d 
      - ./proxy/https:/ssl
    ports:
      - "80:80"
      - "443:443"
    networks:
      - eventhub-net
    command: ["nginx", "-g", "daemon off;"]

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    networks:
      - eventhub-net
volumes:
  portainer_data:

networks:
  eventhub-net:
    external: true
