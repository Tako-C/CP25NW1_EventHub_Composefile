# version: '3.9'

services:
  eventhub-api:
    build: ./CP25NW1_EventHub_Backend
    container_name: eventhub_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:oracle:thin:@Oracle_Event_hub:1521/XEPDB1"
      SPRING_DATASOURCE_USERNAME: "C##ADMIN"
      SPRING_DATASOURCE_PASSWORD: "admin123"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    volumes:
      - ./upload:/upload 
    networks:
      - eventhub-net
    restart: unless-stopped
    
  eventhub-frontend:
    build:
      context: .
      args:
        # NEXT_PUBLIC_API_URL: http://cp25nw1.sit.kmutt.ac.th:8080
        # NEXT_PUBLIC_API_URL: https://cp25nw1.sit.kmutt.ac.th/api
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: eventhub_frontend
    ports:
      - '3000:3000'
    environment:
      # - NEXT_PUBLIC_API_URL=http://cp25nw1.sit.kmutt.ac.th:8080
      # - NEXT_PUBLIC_API_URL=https://cp25nw1.sit.kmutt.ac.th/api
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    networks:
      - eventhub-net
    
  oracledb:
    image: container-registry.oracle.com/database/express
    container_name: Oracle_Event_hub
    environment:
      ORACLE_PWD: "system1234"
      ORACLE_CHARACTERSET: "AL32UTF8"
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - ./CP25NW1_EventHub_Backend/script_create_schema.sql:/tmp/script_create_schema.sql
    networks:
      - eventhub-net
    restart: unless-stopped

  proxy:
    container_name: eventhub_proxy
    image: nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d 
      - ./proxy/https:/ssl
    ports:
      - "80:80"
      - "443:443"
    networks:
      - eventhub-net
    command: ["nginx", "-g", "daemon off;"]

networks:
  eventhub-net:
    external: true
