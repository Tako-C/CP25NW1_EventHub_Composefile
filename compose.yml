# version: '3.9'

services:
  eventhub-api:
    build: ./CP25NW1_EventHub_Backend
    container_name: eventhub_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:oracle:thin:@Oracle_Event_hub:1521/XEPDB1"
      SPRING_DATASOURCE_USERNAME: "C##ADMIN"
      SPRING_DATASOURCE_PASSWORD: "admin123"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    volumes:
      - ./upload:/upload 
    networks:
      - eventhub-net
    restart: unless-stopped

  nextjs:
    build: ./CP25NW1_EventHub_Frontend
    container_name: nextjs_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - .:/app
      - /app/node_modules
    
  oracledb:
    image: container-registry.oracle.com/database/express
    container_name: Oracle_Event_hub
    environment:
      ORACLE_PWD: "system1234"
      ORACLE_CHARACTERSET: "AL32UTF8"
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - ./CP25NW1_EventHub_Backend/script_create_schema.sql:/tmp/script_create_schema.sql
    networks:
      - eventhub-net
    restart: unless-stopped
    
  proxy:
    container_name: eventhub_proxy
    image: nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d 
      - ./proxy/https:/ssl
    ports:
      - "80:80"
      - "443:443"
    networks:
      - eventhub-net
    command: ["nginx", "-g", "daemon off;"]

networks:
  eventhub-net:
    external: true
